# Render's free plan sleeps the API after ~15 idle minutes, and waking it takes
# 40+ seconds. Ping /health every 5 minutes (GitHub may delay or skip a run; a second pinger on cron-job.org backs this up) so learners never wait on a cold start.
name: Keep the API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://christopher-e1a5.onrender.com/health
